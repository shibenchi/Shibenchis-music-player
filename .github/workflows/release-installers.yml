name: Build installers

# push a version tag like 1.4.7 (no "v": a tag that starts with v runs the macOS workflow instead) and this builds the Windows
# installer and the Android apk on github's machines and puts them on the release of that tag (a draft release is made when
# there is none yet, write its notes and publish it). a manual run from the Actions tab only builds: the files are kept as
# workflow artifacts and no release is touched
#
# the Android part needs the signing key in the repository secrets (settings, secrets and variables, actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD (and ANDROID_KEY_ALIAS, "smp" when it is left out)
# without them the apk is skipped and the Windows installer is still built. every update of the app has to be signed with the
# same key or phones refuse it
#
# signing the list of the update server (the screens that installed apps download) and putting it on the club server is NOT
# done here: that key never leaves the owner's computer
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      android:
        description: "build the apk too (needs the signing key in the secrets)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  BUNDLED_NODE_VERSION: 22.11.0
  CI: "false"
  # the addresses that are baked into the screens: the club server and the second address of it
  REACT_APP_SOCIAL_API_BASE_URL: https://shibenchi.members.purduehackers.com
  REACT_APP_SOCIAL_WS_BASE: wss://shibenchi.members.purduehackers.com/smp-ws
  REACT_APP_SOCIAL_API_FALLBACK_URL: https://shibenchi-music.tail55b1b3.ts.net

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (build tooling)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # the app starts its local server with this node, it is a plain file that is not in git
      - name: Fetch the bundled Node.js runtime (windows x64)
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          curl -fsSL "https://nodejs.org/dist/v${BUNDLED_NODE_VERSION}/win-x64/node.exe" -o src-tauri/binaries/node.exe

      - name: Install dependencies
        run: npm ci

      # the packages that go into the app (better-sqlite3 is native: it has to be the windows one)
      - name: Install the server runtime dependencies
        working-directory: dist-server
        run: npm install

      # the two notification sounds are not in the repository (they are kept out of it on purpose). without them the
      # installer is built all the same and the app is silent where it would play one
      - name: Check the notification sounds
        shell: bash
        run: |
          for f in "public/SMP notif.wav" "public/SMP notif 2.wav"; do
            if [ ! -f "$f" ]; then echo "::warning::$f is not in the repository, the installer will not have it"; fi
          done

      # msi only: the nsis installer is not wanted (and its step fails on some machines)
      - name: Build the Windows installer
        run: npx tauri build --bundles msi

      - name: Name the installer and note its hash
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MSI=$(ls src-tauri/target/release/bundle/msi/*.msi | head -1)
          mkdir -p out
          cp "$MSI" "out/Shibenchis-Music-Player_${VERSION}_x64_en-US.msi"
          sha256sum out/*.msi
          ls -l out

      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/*.msi
          if-no-files-found: error

      - name: Put the installer on the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Shibenchi's Music Player $GITHUB_REF_NAME" --notes "notes follow" || true
          gh release upload "$GITHUB_REF_NAME" out/*.msi --clobber

  # the apk can only be signed when the key is there
  signing-key:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Is the signing key in the secrets?
        id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::warning::no Android signing key in the repository secrets, the apk is skipped"; fi

  android:
    needs: signing-key
    if: needs.signing-key.outputs.present == 'true' && (github.event_name == 'push' || inputs.android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (build tooling)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # the same parts of the Android sdk as on the computer the app is built on
      - name: Android sdk parts
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Write the signing key where gradle looks for it
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/smp-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/smp-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-smp}"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/smp-signing.properties"
          echo "SMP_SIGNING_PROPS=$RUNNER_TEMP/smp-signing.properties" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build the apk
        run: npx tauri android build --apk --target aarch64

      - name: Name the apk and note its hash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK=$(ls src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk | head -1)
          mkdir -p out
          cp "$APK" "out/Shibenchis-Music-Player_${VERSION}.apk"
          sha256sum out/*.apk
          ls -l out

      - name: Keep the apk as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Put the apk on the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Shibenchi's Music Player $GITHUB_REF_NAME" --notes "notes follow" || true
          gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
